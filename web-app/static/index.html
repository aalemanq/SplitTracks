<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split Tracks</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header id="header">
  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 48 48" class="logo">
      <rect x="1" y="1" width="46" height="46" rx="13" fill="#062b34"/>
      <path d="M7 28c5-12 8 8 13-5s8-5 12 1 6-4 9-9" fill="none" stroke="#2aa198" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M7 33c5-10 8 5 13-5s8-3 12 2 6-3 9-7" fill="none" stroke="#d33682" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M7 22c5-7 8 5 13-3s8-2 12 3 6-1 9-4" fill="none" stroke="#b58900" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span class="brand-split">Split</span><span class="brand-tracks">Tracks</span>
  </div>
  <div class="header-spacer"></div>
</header>

<main id="main">
  <div id="importPanel">
    <div class="import-card">
      <div class="import-tabs">
        <button class="import-tab active" data-tab="url">YouTube URL</button>
        <button class="import-tab" data-tab="file">Archivo local</button>
      </div>
      <div class="import-content" id="importUrl">
        <input type="text" id="youtubeUrl" placeholder="Pega aquí una URL de YouTube…">
      </div>
      <div class="import-content hidden" id="importFile">
        <label class="file-drop">
          <span class="file-drop-icon">🎵</span>
          <span>Arrastra un archivo o haz clic para seleccionar</span>
          <span class="file-drop-hint">MP3, WAV, FLAC — estéreo de 2 canales</span>
          <input type="file" id="fileInput" accept="audio/*" hidden>
        </label>
      </div>
      <div class="stem-select">
        <span class="stem-select-label">Extraer:</span>
        <div class="stem-chips" id="stemChips"></div>
      </div>
      <button id="processBtn" class="btn btn-process" disabled>
        <span class="btn-process-icon">⚡</span> Procesar
      </button>
    </div>
  </div>

  <div id="progressPanel" hidden>
    <div class="progress-card">
      <div class="progress-header">
        <span id="progressTitle">Procesando...</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-phase" id="progressPhase"></span>
      <button id="cancelBtn" class="btn btn-outline btn-sm" hidden>Cancelar</button>
    </div>
  </div>

  <div id="studioPanel" hidden>
    <div class="studio-header">
      <span class="studio-title">Resultado</span>
      <span class="studio-meta" id="studioMeta"></span>
    </div>
    <div class="studio-body">
      <div class="waveform-area" id="waveformArea">
        <canvas id="waveform" class="waveform-canvas"></canvas>
      </div>
      <div class="mixer" id="mixer"></div>
    </div>
  </div>
</main>

<footer id="footer" hidden>
  <div class="footer-left">
    <div class="transport">
      <button id="stopBtn" class="btn btn-icon" title="Stop">⏹</button>
      <button id="playBtn" class="btn btn-play" title="Play / Pause">▶</button>
    </div>
    <div class="timeline-wrap">
      <span class="time-label" id="currentTime">0:00</span>
      <input type="range" id="timeline" min="0" max="100" value="0" class="timeline">
      <span class="time-label" id="totalTime">0:00</span>
    </div>
  </div>
  <div class="footer-right">
    <div class="volume-wrap">
      <span class="vol-icon">🔊</span>
      <input type="range" id="masterVolume" min="0" max="150" value="100" class="vol-slider">
    </div>
    <button id="exportMixBtn" class="btn btn-green" disabled>Exportar mezcla MP3</button>
  </div>
</footer>

<script src="/static/js/api.js"></script>
<script src="/static/js/player.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
