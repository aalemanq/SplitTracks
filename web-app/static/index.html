<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split Tracks</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header id="header">
  <div class="brand">
    <svg width="38" height="38" viewBox="0 0 48 48" class="logo">
      <rect x="1" y="1" width="46" height="46" rx="13" fill="#062b34"/>
      <path d="M7 28c5-12 8 8 13-5s8-5 12 1 6-4 9-9" fill="none" stroke="#2aa198" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M7 33c5-10 8 5 13-5s8-3 12 2 6-3 9-7" fill="none" stroke="#d33682" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M7 22c5-7 8 5 13-3s8-2 12 3 6-1 9-4" fill="none" stroke="#b58900" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span class="brand-split">Split</span>
    <span class="brand-tracks">Tracks</span>
  </div>
  <div class="import-bar" id="importBar">
    <input type="text" id="youtubeUrl" placeholder="Pega una URL de YouTube…" class="url-input">
    <button id="addUrlBtn" class="btn btn-cyan">Añadir</button>
    <span class="or-sep">o</span>
    <label class="btn btn-outline file-label">
      Subir audio
      <input type="file" id="fileInput" accept="audio/*" hidden>
    </label>
  </div>
  <div class="stem-chips" id="stemChips"></div>
  <button id="processBtn" class="btn btn-yellow" disabled>Procesar</button>
</header>

<main id="main">
  <div id="statusBar">
    <div class="status-pill" id="statusPill">Esperando audio</div>
    <div class="progress-bar" id="progressWrap" hidden>
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <span class="progress-label" id="progressLabel"></span>
  </div>
  <div id="studio" hidden>
    <div class="mixer" id="mixer"></div>
  </div>
</main>

<footer id="footer" hidden>
  <div class="transport">
    <button id="stopBtn" class="btn btn-icon" title="Stop">⏹</button>
    <button id="playBtn" class="btn btn-play" title="Play / Pause">▶</button>
    <div class="volume-wrap">
      <span class="vol-icon">🔊</span>
      <input type="range" id="masterVolume" min="0" max="150" value="100" class="vol-slider">
    </div>
  </div>
  <div class="timeline-wrap">
    <span class="time-label" id="currentTime">0:00</span>
    <input type="range" id="timeline" min="0" max="100" value="0" class="timeline">
    <span class="time-label" id="totalTime">0:00</span>
  </div>
  <div class="export-btns">
    <button id="exportMixBtn" class="btn btn-green" disabled>Exportar mezcla MP3</button>
    <button id="exportStemsBtn" class="btn btn-outline" disabled>Exportar pistas MP3</button>
  </div>
</footer>

<script src="/static/js/api.js"></script>
<script src="/static/js/player.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
