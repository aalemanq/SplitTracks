<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split Tracks</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header id="header">
  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 48 48" class="logo"><rect x="1" y="1" width="46" height="46" rx="13" fill="#062b34"/><path d="M7 28c5-12 8 8 13-5s8-5 12 1 6-4 9-9" fill="none" stroke="#2aa198" stroke-width="2.8" stroke-linecap="round"/><path d="M7 33c5-10 8 5 13-5s8-3 12 2 6-3 9-7" fill="none" stroke="#d33682" stroke-width="2.2" stroke-linecap="round"/><path d="M7 22c5-7 8 5 13-3s8-2 12 3 6-1 9-4" fill="none" stroke="#b58900" stroke-width="2" stroke-linecap="round"/></svg>
    <span class="brand-split">Split</span><span class="brand-tracks">Tracks</span>
  </div>
  <div class="header-source">
    <input type="text" id="youtubeUrl" placeholder="Pega aquí una URL de YouTube…" class="url-input">
    <button id="addUrlBtn" class="btn btn-cyan">Añadir</button>
    <span class="or-sep">o</span>
    <label class="btn btn-outline file-label">Subir audio <input type="file" id="fileInput" accept="audio/*" hidden></label>
  </div>
  <div class="stem-chips" id="stemChips"></div>
  <button id="processBtn" class="btn btn-yellow" disabled>Separar</button>
  <button id="exitBtn" class="btn btn-outline btn-sm">Salir</button>
</header>

<main id="main">
  <aside id="sidebar">
    <div class="sidebar-section" id="harmonyPanel">
      <div class="section-title">Cifrado humano</div>
      <div class="section-note">Cifra Club · versiones revisadas</div>
      <div class="harmony-search">
        <input type="text" id="harmonyArtist" placeholder="Artista" class="harmony-input">
        <input type="text" id="harmonyTitle" placeholder="Canción" class="harmony-input">
        <button id="harmonySearchBtn" class="btn btn-cyan btn-sm">Buscar</button>
      </div>
      <div class="harmony-status" id="harmonyStatus">Aún no se ha seleccionado una fuente.</div>
      <div class="harmony-versions" id="harmonyVersions"></div>
    </div>

    <div class="sidebar-section" id="analysisPanel" hidden>
      <div class="section-title">Análisis</div>
      <div class="metrics-grid" id="metricsGrid"></div>
    </div>

    <div class="sidebar-section" id="pitchPanel" hidden>
      <div class="section-title">Transponer</div>
      <div class="section-note">Cambia preescucha, tonalidad, acordes y grados en vivo</div>
      <div class="pitch-controls">
        <button id="pitchUp" class="btn tone-btn" disabled>+</button>
        <span class="pitch-value" id="pitchValue">Original · 0 semitonos</span>
        <button id="pitchDown" class="btn tone-btn" disabled>−</button>
        <button id="pitchReset" class="btn btn-sm btn-outline" disabled>Original</button>
      </div>
    </div>

    <div class="sidebar-section" id="tempoPanel" hidden>
      <div class="section-title">Velocidad</div>
      <div class="section-note">Cambia el tempo sin alterar el tono</div>
      <div class="pitch-controls">
        <button id="tempoUp" class="btn tone-btn" disabled>+</button>
        <span class="pitch-value" id="tempoValue">×1.00 · original</span>
        <button id="tempoDown" class="btn tone-btn" disabled>−</button>
        <button id="tempoReset" class="btn btn-sm btn-outline" disabled>×1.00</button>
      </div>
    </div>
  </aside>

  <section id="workspace">
    <div id="progressPanel" hidden>
      <div class="progress-card">
        <div class="progress-header">
          <span id="progressTitle">Procesando...</span>
          <span id="progressPct">0%</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-row">
          <span id="progressPhase" class="progress-phase"></span>
          <span id="progressElapsed" class="progress-elapsed" hidden></span>
          <button id="cancelBtn" class="btn btn-sm btn-outline" hidden>Cancelar</button>
        </div>
      </div>
    </div>

    <div id="studioPanel" hidden>
      <div class="transport-bar" id="transportBar">
        <div class="transport">
          <button id="stopBtn" class="btn btn-icon" title="Stop">⏹</button>
          <button id="playBtn" class="btn btn-play" title="Play / Pause">▶</button>
        </div>
        <div class="volume-wrap">
          <span class="vol-icon">🔊</span>
          <input type="range" id="masterVolume" min="0" max="150" value="100" class="vol-slider">
        </div>
        <div class="timeline-wrap">
          <span class="time-label" id="currentTime">0:00</span>
          <input type="range" id="timeline" min="0" max="100" value="0" class="timeline">
          <span class="time-label" id="totalTime">0:00</span>
        </div>
        <div class="transport-exports">
          <button id="exportMixBtn" class="btn btn-green" disabled>Exportar mezcla MP3</button>
          <button id="exportStemsBtn" class="btn btn-outline" disabled>Exportar pistas MP3</button>
        </div>
      </div>
      <canvas class="spectrum-canvas" id="spectrumCanvas" width="600" height="60" hidden></canvas>
      <div class="studio-meta" id="studioMeta"></div>
      <div class="mixer-section">
        <div class="mixer" id="mixer"></div>
      </div>
    </div>

    <div class="chord-panels" id="chordPanels" hidden></div>
  </section>
</main>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
